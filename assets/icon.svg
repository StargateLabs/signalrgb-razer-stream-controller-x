<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SignalRGB plugin per Razer Stream Controller X">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00b4d8"/>
      <stop offset="25%"  stop-color="#00e5a0"/>
      <stop offset="50%"  stop-color="#f5a623"/>
      <stop offset="75%"  stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#b14aff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00b4d8"/>
      <stop offset="50%"  stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#b14aff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="80" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- corpo del deck -->
  <g filter="url(#soft)">
    <rect x="72" y="150" width="368" height="230" rx="26" fill="url(#deck)" stroke="#3d444d" stroke-width="3"/>
  </g>

  <!-- striscia spettrale: il segnale RGB -->
  <rect x="92" y="168" width="328" height="8" rx="4" fill="url(#spectrum)" opacity="0.95"/>

  <!-- display 480x288 -->
  <g filter="url(#glow)">
    <rect x="92" y="188" width="328" height="128" rx="10" fill="#05070a" stroke="#2d333b" stroke-width="2"/>
  </g>

  <!-- onda audio sul display -->
  <path d="M100 262
           L112 262 L118 236 L124 288 L130 252 L136 268 L142 262
           L156 262 L162 222 L168 300 L174 246 L180 270 L186 262
           L200 262 L206 240 L212 284 L218 254 L224 266 L230 262
           L244 262 L250 208 L256 312 L262 238 L268 274 L274 262
           L288 262 L294 244 L300 282 L306 256 L312 265 L318 262
           L332 262 L338 230 L344 292 L350 248 L356 268 L362 262
           L376 262 L382 250 L388 276 L394 258 L400 264 L406 262
           L412 262"
        fill="none" stroke="url(#wave)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- griglia dei 15 tasti: 5 x 3 -->
  <g fill="#3d444d">
    <rect x="100" y="330" width="58" height="12" rx="6"/>
    <rect x="166" y="330" width="58" height="12" rx="6"/>
    <rect x="232" y="330" width="58" height="12" rx="6"/>
    <rect x="298" y="330" width="58" height="12" rx="6"/>
    <rect x="364" y="330" width="58" height="12" rx="6"/>
  </g>
  <g fill="#2d333b">
    <rect x="100" y="350" width="58" height="12" rx="6"/>
    <rect x="166" y="350" width="58" height="12" rx="6"/>
    <rect x="232" y="350" width="58" height="12" rx="6"/>
    <rect x="298" y="350" width="58" height="12" rx="6"/>
    <rect x="364" y="350" width="58" height="12" rx="6"/>
  </g>

  <!-- cavo USB-C -->
  <path d="M256 150 L256 116" stroke="#3d444d" stroke-width="10" stroke-linecap="round"/>
  <rect x="234" y="92" width="44" height="26" rx="6" fill="#484f58" stroke="#6e7681" stroke-width="2"/>

  <!-- badge fps misurati -->
  <g filter="url(#soft)">
    <rect x="150" y="404" width="212" height="46" rx="23" fill="#010409" stroke="#21262d" stroke-width="2"/>
  </g>
  <text x="256" y="434" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="700" fill="#00e5a0" text-anchor="middle">480 × 288 · RGB565</text>
</svg>